<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoTutor</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div class="brand">VideoTutor</div>
    <div id="app-status" class="muted">正在连接桌面程序…</div>
  </header>

  <section id="video" hidden>
    <h1 id="video-title"></h1>
    <p id="video-status" class="muted"></p>
    <p id="summary" class="summary"></p>
    <div class="listen-row">
      <button id="missed-btn" class="small" title="回放刚才那句，并记为听力难点">没听清 · 重放 <kbd>Alt+R</kbd></button>
      <span id="missed-count" class="muted"></span>
    </div>
    <section id="prewatch" class="card"></section>
  </section>

  <p id="hint" class="hint"></p>
  <button id="retry" hidden>重新连接</button>

  <ol id="transcript" hidden></ol>
  <div id="popover" class="popover" hidden></div>

  <script type="module" src="src/sidepanel.js"></script>
</body>
</html>
