<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>VideoTutor</title>
<style>
  :root { --text: #1f2937; --muted: #6b7280; --bg: #fff; --ok: #16a34a; --warn: #d97706; --err: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f3f4f6; --muted: #9ca3af; --bg: #1f2937; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .connected { color: var(--ok); }
  .incompatible { color: var(--warn); }
  .offline { color: var(--err); }
  button { margin-top: 8px; }
</style>
</head>
<body>
  <h1>VideoTutor</h1>
  <p id="status" class="muted">正在连接桌面程序…</p>
  <p id="hint" class="muted"></p>
  <button id="retry" hidden>重新连接</button>
  <script type="module" src="src/sidepanel.js"></script>
</body>
</html>
